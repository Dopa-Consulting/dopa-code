<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 240" width="240" height="240">
  <defs>
    <radialGradient id="sun-glow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#fbbf24" stop-opacity="1"/>
      <stop offset="60%" stop-color="#f59e0b" stop-opacity="0.9"/>
      <stop offset="100%" stop-color="#d97706" stop-opacity="0.6"/>
    </radialGradient>
    <radialGradient id="core-glow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#fef3c7" stop-opacity="1"/>
      <stop offset="50%" stop-color="#fbbf24" stop-opacity="0.8"/>
      <stop offset="100%" stop-color="#f59e0b" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <!-- Background circle -->
  <circle cx="120" cy="120" r="115" fill="#0f172a" stroke="#1e293b" stroke-width="2"/>

  <!-- 8 geometric rays (Inti sun) -->
  <g transform="translate(120,120)">
    <!-- Cardinal rays (N, S, E, W) - larger -->
    <polygon points="0,-50 -10,-90 0,-115 10,-90" fill="#f59e0b" opacity="0.9"/>
    <polygon points="0,50 10,90 0,115 -10,90" fill="#f59e0b" opacity="0.9"/>
    <polygon points="50,0 90,-10 115,0 90,10" fill="#f59e0b" opacity="0.9"/>
    <polygon points="-50,0 -90,10 -115,0 -90,-10" fill="#f59e0b" opacity="0.9"/>

    <!-- Diagonal rays (NE, SE, SW, NW) - smaller -->
    <polygon points="35,-35 64,-64 82,-82 82,-50" fill="#d97706" opacity="0.7" transform="rotate(0)"/>
    <polygon points="35,35 64,64 82,82 50,82" fill="#d97706" opacity="0.7"/>
    <polygon points="-35,35 -64,64 -82,82 -50,82" fill="#d97706" opacity="0.7"/>
    <polygon points="-35,-35 -64,-64 -82,-82 -82,-50" fill="#d97706" opacity="0.7"/>

    <!-- Core sun circle -->
    <circle cx="0" cy="0" r="45" fill="url(#sun-glow)"/>
    <circle cx="0" cy="0" r="30" fill="url(#core-glow)"/>

    <!-- Inner geometric ring -->
    <circle cx="0" cy="0" r="38" fill="none" stroke="#fbbf24" stroke-width="1.5" stroke-dasharray="8,4" opacity="0.6"/>
    <circle cx="0" cy="0" r="22" fill="none" stroke="#fef3c7" stroke-width="1" stroke-dasharray="4,3" opacity="0.4"/>

    <!-- Center dot (the 'I' in Inti) -->
    <circle cx="0" cy="0" r="8" fill="#0f172a"/>

    <!-- Subtle glow -->
    <circle cx="0" cy="0" r="65" fill="none" stroke="#fbbf24" stroke-width="0.5" opacity="0.2"/>
    <circle cx="0" cy="0" r="80" fill="none" stroke="#fbbf24" stroke-width="0.5" opacity="0.1"/>
  </g>
</svg>
